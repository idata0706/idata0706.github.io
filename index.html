<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Visualisation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <div class="header">
        <h1 class="heading outermost">Clear Readings!</h1>
        
            <div class="explaination">
                <h2 class="heading outer">Wear Levels At A Glance:</h2>
                <div class="inner-container">
                    <div class="status-item">
                        <span class="icon green">&#128522</span>
                        <h2 class="heading inner green">Green  Keep_Going</h2>
                    </div>
                    <div class="status-item">
                        <h2 class="heading inner red">Red  Maintenance</h2>
                        <span class="icon red">&#128543</span>
                    </div>
                </div>
            </div>
        
        <select class="heading" type="module" id="fileDropdown">--Select a file--</select>
    </div>
   
    
    <script type="module" src="index.js"></script>
</body>
</html>
